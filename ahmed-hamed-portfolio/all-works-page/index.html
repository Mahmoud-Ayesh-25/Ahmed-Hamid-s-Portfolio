<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <meta name="description" content="Explore Ahmed Hamed's motion graphics and visual storytelling projects.">

        <meta name="author" content="Ahmed Hamed">

        <meta name="theme-color" content="black">

        <link rel="icon" type="image/svg+xml" href="../icons/logo.svg">
        <link rel="icon" type="image/png" href="../icons/logo-web.png">
        <link rel="apple-touch-icon" sizes="180x180" type="image/png" href="../icons/logo-apple.png">
        <link rel="icon" sizes="192x192" type="image/png" href="../icons/logo-android.png">

        <link rel="preload" href="../fonts/arimo-v36-latin-regular.woff2" as="font" type="font/woff2" crossorigin>
        <link rel="preload" href="../fonts/anton-v27-latin-regular.woff2" as="font" type="font/woff2" crossorigin>
        <link rel="preload" href="../fonts/dancing-script-v29-latin-regular.woff2" as="font" type="font/woff2" crossorigin>
        <link rel="stylesheet" href="../general.css" />
        <link rel="stylesheet" href="../dialog.css" />
        <link rel="stylesheet" href="style.css" />
        <script src="script.js" defer></script>
        <title>All Works</title>
    </head>
    <body>
        
        <a id="back-to-top" href="#header-content">BACK TO TOP
            <svg aria-hidden="true"><use href="../icons.svg#right-arrow-2"></use></svg>
        </a>

        <header>
            
            <div id="header-content">

                <button aria-label="Back to home button" id="back-to-home">
                    <svg aria-hidden="true"><use href="../icons.svg#right-arrow-2"></use></svg>
                </button>

                <h1>ALL
                    WORKS
                </h1>

                <p>EXPLORE ALL MY PROJECTS ACROSS DIFFERENT CATEGORIES.</p>

                <nav aria-label="Project categories">
                    <ul>
                        <li><button class="catagory-option selected">ALL</button></li>
                        <li><button class="catagory-option">VIDEO EDITING</button></li>
                        <li><button class="catagory-option">MOTION GRAPHICS</button></li>
                        <li><button class="catagory-option">TYPOGRAPHY</button></li>
                        <li><button class="catagory-option">ILLUSTRATION</button></li>
                        <li><button class="catagory-option">BRAND IDENTITIES</button></li>
                    </ul>
                </nav>
                <hr>
            </div>

        </header>

        <main>
            <section id="works" aria-label="Projects">

            </section>
        </main>


        <dialog id="video-player-dialog" aria-label="Project video preview">
            <div>
                <button id="close-dialog" aria-label="Close video">
                    <svg aria-hidden="true"><use href="../icons.svg#close"></use></svg>
                </button>
                <iframe id="video-player"
                src="" 
                title="YouTube video player" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                referrerpolicy="strict-origin-when-cross-origin" 
                allowfullscreen></iframe>
            </div>
        </dialog>

    </body>
</html>
